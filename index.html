<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Socket live test</title>
    <style>
        body{
            font-family: sans-serif;padding: 20px;background: #121212;
            color: #fff;
            
        }#log{
            background: #000;padding: 10px;height: 300px;
        
        }.status-on{
            color: #00ff00;
        }
        .status-off{
            color: #ff0000;
        }
    </style>
</head>
<body>
    <h1>Websocket Broadcast Console</h1>
    <p class="status-off" id="status">Connecting</p>

    <form id="message-form" action="
    ">
<input type="text" id="message-input" placeholder="Send Cargo..." required>
<button type="submit">Deploy Message</button>
</form>
<h3>Live Stream Logs</h3>
<pre id="log">

</pre>
</body>
<script>
    const statusEl = document.getElementById("status")
    const log = document.getElementById("log")
    const input = document.getElementById("message-input")

    //1. Initiate the handshake
    const socket = new WebSocket('ws://localhost:8080');
    const appendLog = (label,message)=>{
        const entry = `${new Date().toLocaleTimeString()} ${label} ${message}\n`
        log.textContent = entry + log.textContent
    }
    socket.addEventListener(
        'open',()=>{
            statusEl.textContent = 'CONNECTED: ws://localhost:8080'
            statusEl.className="status-on";
            appendLog('[SYSTEM]','Tunnel Established.')
        }
    )
    socket.addEventListener(
        'close',()=>{
            statusEl.textContent = 'DISCONNECTED'
            statusEl.className="status-off";
            appendLog('[SYSTEM]','Tunnel Collapsed.')
        }
    )
    socket.addEventListener('message',(e)=>{
        appendLog('[RECEIVED]',e.data)
    })

    document.getElementById('message-form').addEventListener('submit',(e)=>{
        e.preventDefault();

        if (socket.readyState !== WebSocket.OPEN) {
            appendLog('[ERROR]','No active tunnel found')
        }
        const msg = input.value.trim();
        socket.send(msg);
        appendLog('[SENT]',msg)
        input.value=''
    })
</script>
</html>
